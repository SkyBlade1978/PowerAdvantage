buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net/' }
        maven {
            name = 'gradle'
            url 'https://plugins.gradle.org/m2/'
        }
        mavenCentral()
        jcenter()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
        classpath 'gradle.plugin.com.matthewprenger:CurseGradle:1.0.11'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

def enableCurseGradle = project.hasProperty('enableCurseGradle')
if (enableCurseGradle) {
    apply plugin: 'com.matthewprenger.cursegradle'
}

import groovy.json.JsonSlurper

description = 'Power Advantage'
def mod_file = getModFile()
def mc_version = '1.12.2'
def forge_version = '14.23.5.2859'

ext {
    short_version = getVersion('VERSION', mod_file)
}

version = "${mc_version}-${short_version}"
if (System.getenv().BUILD_NUMBER) {
    version += ".${System.getenv().BUILD_NUMBER}"
}
group = 'com.mcmoddev.poweradvantage'
archivesBaseName = 'PowerAdvantage'
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

sourceSets {
    main {
        // Forge's dev mod discovery uses the compiled classes output as the
        // mod container, so keep processed resources beside classes for
        // runClient/runServer instead of only under build/resources.
        output.resourcesDir = output.classesDir
    }
}

// RF support is compiled against this local API jar because this legacy API is
// no longer available from the old mod-era Maven setup.
def localLibDir = file('libs')
def rfApiJarName = 'RF-API.jar'
def rfApiJar = new File(localLibDir, rfApiJarName)

class Secrets {
    def data = null

    def getProperty(String key) {
        return data ? data[key] : ''
    }
}

def secretFile
if (System.getenv().SECRET_FILE) {
    secretFile = file System.getenv().SECRET_FILE
} else {
    secretFile = file 'secret.json'
}

project.ext.secret = new Secrets()
if (secretFile.exists()) {
    secretFile.withReader {
        project.ext.secret.data = new JsonSlurper().parse it
    }
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }

        server {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

repositories {
    maven { // Mantle, TCon, JEI
        name 'DVS1 Maven FS'
        url 'http://dvs1.progwml6.com/files/maven'
    }
    maven { // CCL, CCC, NEI
        name 'Chickenbones Repo'
        url 'http://chickenbones.net/maven/'
    }
    maven { // CoFH
        name 'Covers Maven'
        url 'http://maven.covers1624.net'
    }
    maven { // Tesla
        name 'epoxide'
        url 'http://maven.epoxide.org'
    }
    maven { // RebornCore / Tech Reborn
        name 'Modmuss50'
        url 'https://maven.modmuss50.me/'
    }
    maven {
        name 'CurseForge'
        url 'https://minecraft.curseforge.com/api/maven/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${mc_version}-${forge_version}"
    compile files(rfApiJar)
    compile fg.deobf('RebornCore:RebornCore-1.12.2:3.19.4.529:universal') {
        transitive = false
    }
}

processResources {
    inputs.property 'version', short_version
    inputs.property 'mcversion', mc_version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand 'version': short_version, 'mcversion': mc_version
    }

    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title': project.archivesBaseName,
            'Specification-Vendor': 'MinecraftModDevelopmentMods',
            'Specification-Version': '1',
            'Implementation-Title': project.archivesBaseName,
            'Implementation-Version': project.version,
            'Implementation-Vendor': 'MinecraftModDevelopmentMods',
            'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

jar.finalizedBy('reobfJar')

task sourceJar(type: Jar) {
    classifier = 'sources'
    from sourceSets.main.allSource
}

task deobfJar(type: Jar) {
    classifier = 'deobf'
    from sourceSets.main.output
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    classifier = 'javadoc'
    from javadoc.destinationDir
}

javadoc {
    failOnError = false
}

artifacts {
    archives deobfJar
    archives sourceJar
    archives javadocJar
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId project.group
            artifactId project.archivesBaseName
            version project.version
            from components.java
            artifact sourceJar {
                classifier 'sources'
            }
            artifact deobfJar {
                classifier 'deobf'
            }
            artifact javadocJar {
                classifier 'javadoc'
            }
        }
    }
    repositories {
        maven {
            credentials {
                username secret.username
                password secret.password
            }
            url secret.url
        }
    }
}

if (enableCurseGradle) {
    curseforge {
        apiKey = secret.curseforgeAPIKey
        project {
            id = '240982'
            changelog = file('CHANGELOG.txt')
            releaseType = 'release'
            addGameVersion(mc_version)
            def displayVersion = getVersion('VERSION', mod_file)
            if (System.getenv().BUILD_NUMBER) {
                displayVersion += ".${System.getenv().BUILD_NUMBER}"
            }
            mainArtifact(jar) {
                displayName = "$project.description $displayVersion"
                relations {
                    requiredLibrary 'mmd-orespawn'
                    requiredLibrary 'base-metals'
                    optionalLibrary 'additional-loot-tables'
                }
            }
            addArtifact(sourceJar) {
                displayName = "$project.description $displayVersion Sources"
            }
            addArtifact(deobfJar) {
                displayName = "$project.description $displayVersion Development"
            }
            addArtifact(javadocJar) {
                displayName = "$project.description $displayVersion Javadoc"
            }
        }
    }
}

String getModFile() {
    String path = ''
    FileTree tree = fileTree(dir: 'src/main/java')
    tree.include '**/*.java'
    tree.visit { element ->
        if (element.file.isFile()) {
            element.file.eachLine { String s ->
                s = s.trim()
                if (s.startsWith('@Mod(')) {
                    path = "src/main/java/$element.relativePath"
                }
            }
        }
    }
    return path
}

String getVersion(String type, String mod_file) {
    String major = '0'
    String revision = '0'
    String patch = '0'
    String prefix = "public static final String $type = \""
    File file = file(mod_file)
    file.eachLine { String s ->
        s = s.trim()
        if (s.startsWith(prefix)) {
            s = s.substring(prefix.length(), s.length() - 2)
            String[] pts = s.split("\\.")

            major = pts[0]
            revision = pts[1]
            patch = pts[2]
        }
    }
    return "$major.$revision.$patch"
}
